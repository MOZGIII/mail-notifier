[licenses]
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Zlib",
  "Unlicense",
  "Unicode-3.0",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[[bans.deny]]
name = "aws-lc-rs"
reason = "prefer ring"

[[advisories.ignore]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error is unmaintained; transitive dependency of GTK3 bindings, no safe upgrade available."

[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "paste crate is unmaintained; transitive dependency via image/rav1e, no safe upgrade available."

[[advisories.ignore]]
id = "RUSTSEC-2026-0192"
reason = "ttf-parser is unmaintained; transitive dependency via cosmic-text/fontdb, no safe upgrade available."
